<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Weather Report</title><link rel="stylesheet" href="styles.css"><script src="index.js" defer="defer"></script><script defer="defer" src="main.js"></script></head><body><div class="container"><header><h1>Weather Report</h1><div class="controls"><form id="searchForm" class="search-form"><input id="locationInput" placeholder="Enter city name..." autocomplete="off" required> <button type="submit">Search</button></form><button id="toggleTemp" class="temp-toggle">°C / °F</button></div></header><div id="loading" class="loading hidden"><div class="spinner"></div><p>Loading weather data...</p></div><div id="errorMessage" class="error-message hidden"></div><section id="currentWeather" class="weather-section hidden"><div class="weather-header"><h2 id="location"></h2><div class="location-date"></div></div><div class="weather-main"><div class="weather-image"><div id="weatherIcon"></div><p id="description"></p></div><div class="weather-info"><div class="temperature"><span id="temp"></span></div></div></div><div class="weather-details"><div class="detail-item"><span class="detail-label">Feels like</span> <span class="detail-value" id="feelsLike"></span></div><div class="detail-item"><span class="detail-label">Humidity</span> <span class="detail-value" id="humidity"></span></div><div class="detail-item"><span class="detail-label">Wind Speed</span> <span class="detail-value" id="windSpeed"></span></div></div></section><section id="forecastSection" class="forecast-section hidden"><h3>7-Day Forecast</h3><div id="forecast" class="forecast-grid"></div></section></div></body></html>
