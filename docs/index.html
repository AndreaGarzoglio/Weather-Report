<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Weather Report</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/><link rel="stylesheet" href="styles.css"/><script src="index.js" defer="defer"></script><script defer="defer" src="main.js"></script></head><body><div class="bg-photo" id="bgPhoto"></div><div class="bg-sky" id="bgSky"></div><div class="bg-scrim"></div><div class="container"><header class="masthead"><p class="eyebrow">Weather Report</p><div class="controls"><form id="searchForm" class="search-form"><input id="locationInput" placeholder="Search a city…" autocomplete="off" required/> <button type="submit">Search</button></form><button id="toggleTemp" class="temp-toggle">°C</button></div></header><div id="loading" class="loading hidden"><div class="spinner"></div><p>Reading the sky…</p></div><div id="errorMessage" class="error-message hidden"></div><section id="currentWeather" class="bulletin hidden"><div class="bulletin-head"><div><h2 id="location"></h2><p class="bulletin-meta" id="selectedMoment"></p></div><div class="bulletin-icon" id="weatherIcon"></div></div><div class="bulletin-temp"><span id="temp"></span><p id="description"></p></div><div class="day-rail" id="dayRail"></div><div class="hour-rail-wrap"><svg class="sparkline" id="sparkline" viewBox="0 0 240 40" preserveAspectRatio="none"></svg><div class="hour-rail" id="hourRail"></div></div><div class="weather-details" id="detailGrid"></div></section></div></body></html>
